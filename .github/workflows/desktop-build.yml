name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install
      - name: Generate app icons
        working-directory: desktop
        run: |
          python3 generate-icons.py icon-src.png
          mkdir -p src-tauri/icons
          npx tauri icon icon-src.png
          rm -f icon-src.png
      - name: Build Tauri app
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Labs-macOS-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install
      - name: Generate app icons
        working-directory: desktop
        shell: bash
        run: |
          python3 generate-icons.py icon-src.png
          mkdir -p src-tauri/icons
          npx tauri icon icon-src.png
          rm -f icon-src.png
      - name: Build Tauri app
        working-directory: desktop
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Labs-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Prompt Labs Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-artifacts/**/*
