name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile
      - name: Generate app icons
        working-directory: desktop
        run: |
          mkdir -p src-tauri/icons
          convert -size 512x512 xc:'#c0392b' /tmp/icon-src.png
          pnpm tauri icon /tmp/icon-src.png
      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Labs-macOS-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile
      - name: Generate app icons
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(512, 512)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(192, 57, 43))
          $g.Dispose()
          $bmp.Save("$env:TEMP\icon-src.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          pnpm tauri icon "$env:TEMP\icon-src.png"
      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Labs-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
