name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  # ── macOS (Apple Silicon + Intel) ─────────────────────────────────────────
  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin   # Apple Silicon (M1/M2/M3)
          - x86_64-apple-darwin    # Intel

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install

      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Labs-macOS-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install

      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Labs-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  # ── Create GitHub Release when a tag is pushed ───────────────────────────
  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Prompt Labs Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-artifacts/**/*
