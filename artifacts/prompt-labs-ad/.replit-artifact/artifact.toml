kind = "web"
previewPath = "/prompt-labs-ad/"
title = "Prompt Labs — Ad Creative"
version = "1.0.0"
id = "artifacts/prompt-labs-ad"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/prompt-labs-ad/" ]
localPort = 20946

[services.development]
run = "pnpm --filter @workspace/prompt-labs-ad run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prompt-labs-ad", "run", "build" ]
publicDir = "artifacts/prompt-labs-ad/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20946"
BASE_PATH = "/prompt-labs-ad/"
